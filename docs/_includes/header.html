<div class="head">
  {% if page.title %}
  <div id="masthead">
    <h3><a href="{{ site.baseurl | prepend: site.url}}">{{ site.title }}</a></h3>
  </div>

  {% else %}
  <div id="masthead">
    <h1>{{ site.title }}</h1>
    <h6 style="text-align:center">{{ site.description }}</h6>
    <nav style="text-align:center; margin-top: 10px;">
      <a href="{{ '/' | relative_url }}">Home</a> | <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
  {% endif %}
</div>
